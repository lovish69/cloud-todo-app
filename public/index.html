<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Todo — Daily Task Manager</title>
<style>
  :root {
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --primary:#4f46e5; --primary-dark:#4338ca; --primary-soft:#eef2ff;
    --green:#059669; --amber:#d97706; --red:#dc2626;
    --card:#ffffff; --bg:#f1f5f9; --input:#f8fafc;
    --shadow:0 1px 3px rgba(15,23,42,.08), 0 8px 24px rgba(15,23,42,.06);
  }
  body.dark {
    --ink:#f1f5f9; --muted:#94a3b8; --line:#334155;
    --primary-soft:rgba(99,102,241,.18);
    --green:#34d399; --amber:#fbbf24; --red:#f87171;
    --card:#1e293b; --bg:#0b1120; --input:#0f172a;
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
  body { background:var(--bg); min-height:100vh; display:flex; justify-content:center;
    padding:32px 16px; transition:background .3s ease; }
  .container { width:100%; max-width:640px; }

  /* ── HERO ── */
  .hero {
    background:linear-gradient(135deg,#312e81 0%,#4f46e5 60%,#6366f1 100%);
    border-radius:20px 20px 0 0; padding:26px 28px 24px; color:#fff;
    position:relative; overflow:hidden;
  }
  body.dark .hero { background:linear-gradient(135deg,#1e1b4b 0%,#312e81 60%,#4338ca 100%); }
  .hero::after { content:''; position:absolute; width:220px; height:220px; border-radius:50%;
    background:rgba(255,255,255,.08); top:-90px; right:-60px; pointer-events:none; }
  .hero-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:8px; position:relative; z-index:2; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; letter-spacing:.3px; }
  .brand .logo { width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; font-size:17px; }
  .brand small { display:block; font-weight:500; font-size:11px; opacity:.75; letter-spacing:.2px; }
  .hero-actions { display:flex; align-items:center; gap:8px; }
  .cloud-badge { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22);
    padding:6px 12px; border-radius:999px; font-size:11px; font-weight:600; }
  .theme-toggle { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22);
    width:34px; height:34px; border-radius:999px; cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; transition:.2s; flex-shrink:0; }
  .theme-toggle:hover { background:rgba(255,255,255,.3); transform:rotate(15deg); }
  .greeting-row { display:flex; justify-content:space-between; align-items:center; z-index:1; position:relative; }
  .greeting h1 { font-size:24px; font-weight:800; letter-spacing:-.3px; }
  .greeting .date { font-size:13px; opacity:.8; margin-top:4px; }
  .ring { position:relative; width:74px; height:74px; }
  .ring svg { transform:rotate(-90deg); }
  .ring .track { fill:none; stroke:rgba(255,255,255,.22); stroke-width:7; }
  .ring .bar { fill:none; stroke:#a5b4fc; stroke-width:7; stroke-linecap:round;
    transition:stroke-dashoffset .6s ease; }
  .ring .pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800; }

  /* ── CARD ── */
  .card { background:var(--card); border-radius:0 0 20px 20px; box-shadow:var(--shadow);
    padding:24px 24px 26px; transition:background .3s ease; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .stat { border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:10px; }
  .stat .ico { width:34px; height:34px; border-radius:10px; display:flex; align-items:center;
    justify-content:center; font-size:15px; }
  .ico-total  { background:#eef2ff; }  body.dark .ico-total  { background:rgba(99,102,241,.18); }
  .ico-active { background:#fffbeb; }  body.dark .ico-active { background:rgba(251,191,36,.15); }
  .ico-done   { background:#ecfdf5; }  body.dark .ico-done   { background:rgba(16,185,129,.15); }
  .stat .num { font-size:19px; font-weight:800; color:var(--ink); line-height:1; }
  .stat .lbl { font-size:10.5px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.4px; }

  .add-row { display:flex; gap:8px; margin-bottom:14px; }
  .add-row input[type=text] { flex:1; border:1.5px solid var(--line); border-radius:12px;
    padding:12px 14px; font-size:14px; outline:none; color:var(--ink); background:var(--input); transition:.2s; }
  .add-row input[type=text]:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .add-row input::placeholder { color:var(--muted); }
  select { border:1.5px solid var(--line); border-radius:12px; padding:0 10px; font-size:12.5px;
    color:var(--ink); background:var(--input); outline:none; cursor:pointer; }
  .add-row button { background:var(--primary); color:#fff; border:none; border-radius:12px;
    padding:0 20px; font-size:14px; font-weight:700; cursor:pointer; transition:.15s; }
  .add-row button:hover { background:var(--primary-dark); transform:translateY(-1px); }

  .filters { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .filters button { border:1px solid var(--line); background:var(--card); color:var(--muted);
    padding:7px 15px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; transition:.15s; }
  .filters button:hover { border-color:var(--primary); color:var(--primary); }
  .filters button.active { background:var(--ink); border-color:var(--ink); color:var(--card); }

  .task-list { list-style:none; display:flex; flex-direction:column; gap:8px; }
  .task { display:flex; align-items:center; gap:12px; padding:13px 14px; border:1px solid var(--line);
    border-radius:14px; transition:.15s; background:var(--card); }
  .task:hover { border-color:#818cf8; box-shadow:0 2px 10px rgba(79,70,229,.12); }
  .task .check { width:22px; height:22px; border:2px solid var(--muted); border-radius:8px; cursor:pointer;
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; transition:.15s; }
  .task .check:hover { border-color:var(--primary); }
  .task.done .check { background:#059669; border-color:#059669; }
  body.dark .task.done .check { background:#10b981; border-color:#10b981; }
  .task .info { flex:1; min-width:0; }
  .task .title { font-size:14px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task.done .title { text-decoration:line-through; color:var(--muted); font-weight:500; }
  .task .meta { display:flex; gap:6px; margin-top:5px; }
  .tag { font-size:10px; font-weight:700; padding:2.5px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.4px; }
  .pri { font-size:10px; font-weight:700; padding:2.5px 9px; border-radius:999px; display:flex; align-items:center; gap:4px; }
  .pri::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pri.high   { background:rgba(220,38,38,.1);  color:#dc2626; }
  .pri.medium { background:rgba(217,119,6,.1);  color:#d97706; }
  .pri.low    { background:rgba(5,150,105,.1);  color:#059669; }
  body.dark .pri.high   { background:rgba(239,68,68,.15);  color:#f87171; }
  body.dark .pri.medium { background:rgba(251,191,36,.15); color:#fbbf24; }
  body.dark .pri.low    { background:rgba(16,185,129,.15); color:#34d399; }
  .task .del { color:var(--muted); font-size:19px; cursor:pointer; transition:.15s; flex-shrink:0;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:8px; opacity:.6; }
  .task .del:hover { color:#dc2626; background:rgba(220,38,38,.1); opacity:1; }

  .empty { text-align:center; padding:36px 10px; color:var(--muted); }
  .empty .big { font-size:34px; margin-bottom:8px; }
  .empty p { font-size:13.5px; }

  /* tag colors — light */
  .tag.personal { background:#ecfdf5; color:#059669; }
  .tag.work     { background:#eef2ff; color:#4f46e5; }
  .tag.study    { background:#f5f3ff; color:#7c3aed; }
  .tag.health   { background:#fff7ed; color:#ea580c; }
  .tag.shopping { background:#fdf2f8; color:#db2777; }
  .tag.general  { background:#f1f5f9; color:#64748b; }
  .tag.devops, .tag.git, .tag.docker, .tag.aws, .tag.cicd, .tag.monitor, .tag.notify, .tag.test
    { background:#eef2ff; color:#4f46e5; }
  /* tag colors — dark */
  body.dark .tag.personal { background:rgba(16,185,129,.15); color:#34d399; }
  body.dark .tag.work     { background:rgba(99,102,241,.18);  color:#a5b4fc; }
  body.dark .tag.study    { background:rgba(139,92,246,.18);  color:#c4b5fd; }
  body.dark .tag.health   { background:rgba(249,115,22,.15);  color:#fdba74; }
  body.dark .tag.shopping { background:rgba(236,72,153,.15);  color:#f9a8d4; }
  body.dark .tag.general  { background:rgba(100,116,139,.2);  color:#cbd5e1; }
  body.dark .tag.devops, body.dark .tag.git, body.dark .tag.docker, body.dark .tag.aws,
  body.dark .tag.cicd, body.dark .tag.monitor, body.dark .tag.notify, body.dark .tag.test
    { background:rgba(99,102,241,.18); color:#a5b4fc; }

  @media (max-width:520px) {
    .add-row { flex-wrap:wrap; }
    .add-row input[type=text] { width:100%; }
    .stats { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <div class="logo">☁️</div>
        <div>Cloud&nbsp;Todo<small>Daily task manager</small></div>
      </div>
      <div class="hero-actions">
        <div class="cloud-badge">🚀 AWS · Docker</div>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle dark / light mode">🌙</button>
      </div>
    </div>
    <div class="greeting-row">
      <div class="greeting">
        <h1 id="greeting">Hello 👋</h1>
        <p class="date" id="todayDate">—</p>
      </div>
      <div class="ring">
        <svg width="74" height="74">
          <circle class="track" cx="37" cy="37" r="31"></circle>
          <circle class="bar" id="ringBar" cx="37" cy="37" r="31"
                  stroke-dasharray="194.8" stroke-dashoffset="194.8"></circle>
        </svg>
        <div class="pct" id="ringPct">0%</div>
      </div>
    </div>
  </header>

  <main class="card">
    <div class="stats">
      <div class="stat"><div class="ico ico-total">🗂️</div>
        <div><div class="num" id="sTotal">0</div><div class="lbl">Total</div></div></div>
      <div class="stat"><div class="ico ico-active">⏳</div>
        <div><div class="num" id="sActive">0</div><div class="lbl">Active</div></div></div>
      <div class="stat"><div class="ico ico-done">✅</div>
        <div><div class="num" id="sDone">0</div><div class="lbl">Done</div></div></div>
    </div>

    <form class="add-row" onsubmit="return false;">
      <input type="text" id="taskInput" placeholder="What do you need to do today?" autocomplete="off">
      <select id="tagSelect" title="Category">
        <option value="personal">Personal</option><option value="work">Work</option>
        <option value="study">Study</option><option value="health">Health</option>
        <option value="shopping">Shopping</option>
      </select>
      <select id="priSelect" title="Priority">
        <option value="high">High</option><option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
      <button onclick="addTask()">Add</button>
    </form>

    <div class="filters">
      <button class="active" onclick="setFilter('all',this)">All</button>
      <button onclick="setFilter('active',this)">Active</button>
      <button onclick="setFilter('completed',this)">Completed</button>
      <button onclick="setFilter('high',this)">🔥 High priority</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="empty" id="emptyState" style="display:none">
      <div class="big">🌤️</div>
      <p><b>All clear!</b><br>Nothing here — add your first task above.</p>
    </div>
  </main>
</div>

<script>
const API = '/api/tasks';
let tasks = [], filter = 'all';

/* ── Theme (dark / light) ── */
function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  document.getElementById('themeToggle').textContent = dark ? '☀️' : '🌙';
  try { localStorage.setItem('cloudtodo-theme', dark ? 'dark' : 'light'); } catch (e) {}
}
function toggleTheme() {
  applyTheme(!document.body.classList.contains('dark'));
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('cloudtodo-theme'); } catch (e) {}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved ? saved === 'dark' : prefersDark);
})();

/* ── Greeting + date ── */
(function(){
  const h = new Date().getHours();
  document.getElementById('greeting').textContent =
    (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + ' 👋';
  document.getElementById('todayDate').textContent =
    new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
})();

async function load() {
  try {
    const r = await fetch(API);
    tasks = await r.json();
  } catch (e) {
    tasks = [
      { id:'1', title:'Morning walk — 30 minutes', completed:true,  tag:'health',   priority:'medium' },
      { id:'2', title:'Complete MCA minor-project report', completed:false, tag:'study',  priority:'high' },
      { id:'3', title:'Team project meeting at 4:00 PM', completed:false, tag:'work',   priority:'high' },
      { id:'4', title:'Buy groceries on the way home', completed:false, tag:'shopping', priority:'low' },
      { id:'5', title:'Read 20 pages of a book', completed:false, tag:'personal', priority:'low' },
      { id:'6', title:'Call home in the evening', completed:false, tag:'personal', priority:'medium' },
    ];
  }
  render();
}

function render() {
  let shown = tasks;
  if (filter === 'active')     shown = tasks.filter(t => !t.completed);
  if (filter === 'completed')  shown = tasks.filter(t =>  t.completed);
  if (filter === 'high')       shown = tasks.filter(t => t.priority === 'high');

  const list = document.getElementById('taskList');
  const empty = document.getElementById('emptyState');
  if (shown.length === 0) { list.innerHTML = ''; empty.style.display = 'block'; }
  else {
    empty.style.display = 'none';
    list.innerHTML = shown.map(t => `
      <li class="task ${t.completed ? 'done' : ''}">
        <div class="check" onclick="toggle('${t.id}')">${t.completed ? '&#10003;' : ''}</div>
        <div class="info">
          <div class="title">${t.title}</div>
          <div class="meta">
            <span class="tag ${(t.tag||'general').toLowerCase()}">${(t.tag||'general')}</span>
            <span class="pri ${(t.priority||'medium').toLowerCase()}">${(t.priority||'medium')}</span>
          </div>
        </div>
        <div class="del" onclick="del('${t.id}')">&#215;</div>
      </li>`).join('');
  }

  const total = tasks.length, done = tasks.filter(t => t.completed).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sActive').textContent = total - done;
  document.getElementById('sDone').textContent = done;
  document.getElementById('ringPct').textContent = pct + '%';
  document.getElementById('ringBar').style.strokeDashoffset = 194.8 * (1 - pct / 100);
}

async function addTask() {
  const input = document.getElementById('taskInput');
  const tag = document.getElementById('tagSelect').value;
  const pri = document.getElementById('priSelect').value;
  if (!input.value.trim()) { input.focus(); return; }
  try {
    const r = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ title: input.value, tag, priority: pri })
    });
    tasks.push(await r.json());
  } catch (e) {
    tasks.push({ id:String(Date.now()), title:input.value, completed:false, tag, priority:pri });
  }
  input.value = '';
  render();
}

async function toggle(id) {
  const t = tasks.find(x => String(x.id) === String(id));
  t.completed = !t.completed;
  try {
    await fetch(`${API}/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ completed: t.completed }) });
  } catch (e) {}
  render();
}

async function del(id) {
  tasks = tasks.filter(t => String(t.id) !== String(id));
  try { await fetch(`${API}/${id}`, { method:'DELETE' }); } catch (e) {}
  render();
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

document.getElementById('taskInput').addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
load();
</script>
</body>
</html>
